[project]
name = "leadradar-parser"
version = "0.1.0"
description = "LeadRadar data ingestion, scraping, and normalization library"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    "aiolimiter>=1.1.0",
    "typer>=0.12.0",
]

[project.scripts]
lr-parser = "leadradar_parser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar_parser"]
