[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadradar-parser"
version = "0.1.0"
description = "Public company data collection and normalization"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiolimiter>=1.2,<2",
  "fast-langdetect>=0.3,<1",
  "hishel[async]>=1.1,<2",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "playwright>=1.63.0",
  "protego>=0.5,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "pyyaml>=6,<7",
  "tenacity>=9.1,<10",
  "trafilatura>=2,<3",
  "typer>=0.19,<1",
]

[project.scripts]
lr-parser = "leadradar_parser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar_parser"]

[tool.hatch.build.targets.wheel.force-include]
"src/leadradar_parser/data" = "leadradar_parser/data"
