[project]
name = "leadradar-auth"
version = "0.1.0"
description = "LeadRadar authentication and user identity library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
]

[project.scripts]
lr-auth = "leadradar_auth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar_auth"]
