[project]
name = "leadradar-ai"
version = "0.1.0"
description = "LeadRadar AI and extraction engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
]

[project.scripts]
lr-ai = "leadradar_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar_ai"]
