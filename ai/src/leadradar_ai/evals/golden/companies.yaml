# Companies of the golden set and the parser fixture each one is analysed on (fixtures: ai/tests/fixtures).
# Employee counts are approximate: they only affect Fit and size rules.
- domain: dhl.com
  name: DHL Group
  fixture: dhl.jsonl
  aliases: [Deutsche Post, Deutsche Post DHL, DHL]
  own_domains: [group.dhl.com, dhl.de]
  country: DE
  industries: [logistics, postal_courier]
  employees: 590000
- domain: lufthansagroup.com
  name: Lufthansa Group
  fixture: lufthansa.jsonl
  aliases: [Deutsche Lufthansa, Lufthansa]
  own_domains: [lufthansa.com]
  country: DE
  industries: [airlines]
  employees: 100000
- domain: sap.com
  name: SAP
  fixture: sap.jsonl
  aliases: [SAP SE]
  country: DE
  industries: [software]
  employees: 100000
  note: vendor trap — sells automation and AI; must be flagged by the vendor rule, not treated as a buyer
- domain: orange.com
  name: Orange SA
  fixture: orange.jsonl
  aliases: [Orange, Orange Group]
  country: FR
  industries: [telecom]
  employees: 130000
  # generic homonyms (Orange County, Orange Public Schools, East Orange…) are caught by the entity filter;
  # these are the ones an account manager would add after seeing them in the news
  homonyms: [Orange Marketing, Orange Lion, Orange Insurance Exchange, Orange 142, Orange Peel]
  note: homonym trap — news about other "Orange" organisations must be rejected (wrong_subject)
- domain: deutschebahn.com
  name: Deutsche Bahn
  fixture: deutschebahn.jsonl
  aliases: [Deutsche Bahn AG, DB]
  own_domains: [bahn.de]
  country: DE
  industries: [rail]
  employees: 320000
  note: real cyber incident (DDoS, Feb 2026) next to an outage that was not an attack
