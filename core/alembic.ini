# A generic, single database configuration.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src %(here)s/../auth/src %(here)s/../ai/src %(here)s/../../parser/src .

# template used to generate migration file names
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
