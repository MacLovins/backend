[project]
name = "leadradar-core"
version = "0.1.0"
description = "LeadRadar Core application, REST API, workers, and database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "taskiq-fastapi>=0.3.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.8.0",
    "typer>=0.12.0",
    "leadradar-parser",
    "leadradar-ai",
    "leadradar-auth",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28,<1",
]

[tool.uv.sources]
leadradar-parser = { workspace = true }
leadradar-ai = { workspace = true }
leadradar-auth = { workspace = true }

[project.scripts]
lr = "leadradar_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadradar_core"]
