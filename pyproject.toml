[project]
name = "leadradar-backend-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "import-linter>=2.1",
    "httpx>=0.28.0",
    "respx>=0.22.0",
]

[tool.uv.workspace]
members = ["parser", "backend/ai", "backend/auth", "backend/backend"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "live: network tests (disabled in normal test runs)",
]
testpaths = [
    "backend/backend/tests",
    "backend/auth/tests",
    "backend/ai/tests",
    "parser/tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "backend/backend/migrations",
    "*.md",
    "**/*.md",
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
"backend/ai/src/leadradar_ai/verification/quotes.py" = ["RUF001"]
"backend/ai/tests/test_verification.py" = ["RUF001"]

[tool.importlinter]
root_packages = ["leadradar_parser", "leadradar_ai", "leadradar_auth", "leadradar_core"]

[[tool.importlinter.contracts]]
name = "Libraries never import the app"
type = "forbidden"
source_modules = ["leadradar_parser", "leadradar_ai", "leadradar_auth"]
forbidden_modules = ["leadradar_core"]

[[tool.importlinter.contracts]]
name = "Libraries are independent of each other"
type = "independence"
modules = ["leadradar_parser", "leadradar_ai", "leadradar_auth"]

[[tool.importlinter.contracts]]
name = "Core uses only public APIs of libraries"
type = "forbidden"
source_modules = ["leadradar_core"]
forbidden_modules = [
    "leadradar_ai.pipeline",
    "leadradar_ai.llm",
    "leadradar_ai.retrieval",
    "leadradar_parser.adapters",
    "leadradar_parser.http",
    "leadradar_auth.security",
]
allow_indirect_imports = true
